name: tests

# Runs on both platforms deliberately. The daemon lives on Linux today, but the
# suite is stdlib-only precisely so it also runs on Windows - which is where a
# future port is headed, and which is the only thing that can prove a change has
# not quietly broken the other side.
on:
  # Long-lived branches only, so a feature branch does not get a push run AND a
  # pull_request run for the same commit.
  push:
    branches: [main, beta, beta-web, windows]

  # Every pull request, whatever it targets.
  #
  # This list used to name branches, which created a chicken-and-egg trap:
  # GitHub evaluates a pull_request trigger using the workflow file on the BASE
  # branch, not the PR's own copy. So a PR opening against a branch that was not
  # yet in this list could not run CI - including the PR that would have added
  # it. #54 hit exactly that and had to be verified by hand instead.
  pull_request:
    branches: ['**']

  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.10 is what production runs; 3.12 catches anything the newer
        # interpreter tightens before it becomes a surprise.
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Every module imports cleanly
        # Catches a syntax error or a bad import before the suite even starts,
        # and would have caught the module-level mistakes found by hand this week.
        run: |
          python -c "import config, db, stats_mgr, queue_mgr, security, list, announce, dcc, irc, commands, update_list; print('all modules import')"

      - name: Compile every source file
        run: python -m compileall -q .

      - name: Run the regression suite
        run: python -m unittest discover -s tests -t . -v
