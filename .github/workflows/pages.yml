# The one-page site (#1309, was #875): site/ published by GitHub Pages.
#
# From an Actions deployment of site/ alone, not "deploy from a branch":
# serving docs/ from a branch would also publish every raw markdown file in
# it. The custom domain, when there is one, is set once in the public repo's
# Settings > Pages and stays across deploys - no CNAME file is needed here.
#
# This file is in both repositories. Pages exists only in the public one, so
# the deploy job runs only there; here it is skipped, not failed.

name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'Ninja-FSE/dccore'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
